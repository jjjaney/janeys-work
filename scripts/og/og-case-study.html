<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@650..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400&display=block');
*{box-sizing:border-box;margin:0}
:root{--bg:#f6f3ec;--ink:#4f4f4f;--muted:rgb(79 79 79/.82);--accent:#4f33cc;--orange:#ff7b4d;--lilac:#cfa2ed;--green:#0b704f;--gold:#c99f43;--sky:#b6d8fe;--maroon:#6b2337}
body{width:1200px;height:630px;overflow:hidden;position:relative;font-family:'Instrument Sans';color:var(--ink);background:var(--bg)}
.mono{font-family:'JetBrains Mono';font-size:19px;letter-spacing:.08em;text-transform:uppercase}
h1{font-family:'Plus Jakarta Sans';font-weight:750;letter-spacing:-.025em;line-height:1.02}
svg{position:absolute;shape-rendering:crispEdges}
</style>
<script>
function mix(a,b){let h=(a*374761393+b*668265263)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296}
function art(id,cols,rows,cell,shape,pal,seed,x,y,flip){
 let r='';for(let c=0;c<cols;c++){const hgt=shape(c,cols,rows,seed);for(let k=0;k<hgt;k++){if(mix(c*7+k,seed)<0.06)continue;const col=pal[Math.floor(mix(c*13+k*5,seed+3)*pal.length)];r+=`<rect x="${flip?cols-1-c:c}" y="${rows-1-k}" width="1" height="1" fill="${col}"/>`}}
 document.getElementById(id).outerHTML=`<svg style="left:${x}px;top:${y}px;width:${cols*cell}px;height:${rows*cell}px" viewBox="0 0 ${cols} ${rows}">${r}</svg>`}
const P=['#ff7b4d','#cfa2ed','#0b704f','#c99f43','#b6d8fe','#6b2337','#4f33cc'];
const grow=(c,n,r,s)=>Math.max(0,Math.min(r,Math.round((c+1)/n*r*0.95+ (mix(c,s)-0.5)*3)));
const mound=(c,n,r,s)=>Math.max(0,Math.round(r*Math.sin(Math.PI*(c+0.5)/n)*0.9+(mix(c,s)-0.5)*2.5));
const stair=(c,n,r,s)=>Math.max(0,Math.min(r,Math.floor((c/n)*5+1)*Math.ceil(r/5)-(mix(c,s)<0.25?1:0)));
</script><div style="position:absolute;left:72px;top:96px;width:640px">
<p class=mono style="color:var(--muted)">Janey Annis</p>
<h1 style="font-size:84px;margin-top:28px">I design the <span style="color:var(--accent)">systems</span> behind the words.</h1>
<p style="font-size:26px;margin-top:30px;line-height:1.4">Human-first content for products and systems.</p></div>
<i id=a></i><script>art('a',9,13,48,grow,P,4,768,6)</script>
